# Reusable workflow: lint, test, build image, scan image for vulnerabilities.
# Call it from any repo: uses: <owner>/github-actions-ci-templates/.github/workflows/reusable-python-ci.yml@main
name: reusable-python-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"
      image-name:
        description: Name for the built container image
        type: string
        default: "demo-app"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Lint with ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

      - name: Unit tests
        run: python -m unittest discover -s app -t . -v

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Trivy
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ inputs.image-name }}:${{ github.sha }}


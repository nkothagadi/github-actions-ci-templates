# Reusable workflow: lint, test, build image, scan image for vulnerabilities.
# Call it from any repo: uses: <owner>/github-actions-ci-templates/.github/workflows/reusable-python-ci.yml@main
name: reusable-python-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"
      image-name:
        description: Name for the built container image
        type: string
        default: "demo-app"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Lint with ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

      - name: Unit tests
        run: python -m unittest discover -s app -t . -v

  build-and-scan:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
